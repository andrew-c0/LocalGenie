[package]
name = "LocalGenie"
version = "0.1.1"
description = "A Tauri 2 app for Qualcomm GenieX"
authors = ["you"]
edition = "2021"

[lib]
name = "local_genie_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
prost-build = "0.14"
protox = "0.10"
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
sea-orm = { version = "1", features = ["sqlx-sqlite", "runtime-tokio"] }
sea-orm-migration = { version = "1", features = ["sqlx-sqlite", "runtime-tokio"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["full"] }
tar = "0.4"
futures-util = "0.3"
chrono = { version = "0.4", features = ["serde"] }
urlencoding = "2"
# Web tools: URL parsing and query encoding (already in the lockfile through reqwest).
url = "2"
# Web tools: gzip bodies from Stack Overflow, unpacked by hand so the other clients keep their behaviour.
flate2 = "1"
# Web tools: page text in the charset the page declares (already in the lockfile through reqwest).
encoding_rs = "0.8"
sysinfo = "0.33"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
prost = "0.14"
# Runtime archives: zip (deflate only: no encryption or zstd codecs).
zip = { version = "2", default-features = false, features = ["deflate"] }
# Runtime archives: tar.bz2 (sherpa-onnx). Default backend is the pure-Rust libbz2-rs-sys: no C toolchain.
bzip2 = "0.6"
tauri-plugin-notification = "~2.4.0"
# Native TLS (schannel) like the rest of the app: the default rustls feature pulls in `ring`, which needs clang to build on Windows ARM64.
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "system-proxy", "zip"] }
tauri-plugin-process = "2"
# MCP client: stdio and streamable HTTP. Default features off (no server, no macros); HTTP uses the reqwest the app already has.
rmcp = { version = "3.9", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
# MCP server ids (v4 is already in the lockfile through other crates).
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_NetworkManagement_IpHelper",
    "Win32_System_Performance",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
